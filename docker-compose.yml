services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emanagement-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      MOBILE_KEY: "${MOBILE_KEY:-changeMe}"
      DB_HOST: "172.17.0.1"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-emanagement}"
      DB_USERNAME: "${DB_USERNAME:-emanagement}"
      DB_PASSWORD: "${DB_PASSWORD:-emanagement_secret}"
      QUEUE_CONNECTION: database
    volumes:
      - storage-data:/var/www/storage
    networks:
      - baota_net

volumes:
  storage-data:

networks:
  baota_net:
    external: true
