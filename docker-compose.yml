services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emanagement-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      MOBILE_KEY: "${MOBILE_KEY:-changeMe}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-emanagement}"
      DB_USERNAME: "${DB_USERNAME:-emanagement}"
      DB_PASSWORD: "${DB_PASSWORD:-emanagement_secret}"
      QUEUE_CONNECTION: database
    volumes:
      - storage-data:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emanagement-net

  mysql:
    image: mysql:8.0
    container_name: emanagement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-emanagement}"
      MYSQL_USER: "${DB_USERNAME:-emanagement}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-emanagement_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emanagement-net

volumes:
  storage-data:
  mysql-data:

networks:
  emanagement-net:
    driver: bridge
