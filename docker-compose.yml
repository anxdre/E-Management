version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: teamway-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - "8080:80"
        environment:
            - APP_ENV=production
            - APP_URL=https://teamway.silentreactive.my.id
        networks:
            - teamway-net

networks:
    teamway-net:
        driver: bridge
